<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Templates</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#12151d; --panel-2:#171b25; --line:#242a38;
    --fg:#e8ecf4; --muted:#8b94a8; --accent:#7c8cff; --accent-2:#3ddc97;
    --shadow:0 12px 40px rgba(0,0,0,.45);
  }
  :root[data-theme="light"]{
    --bg:#f6f7fb; --panel:#ffffff; --panel-2:#f0f2f8; --line:#e2e6f0;
    --fg:#141821; --muted:#5f6879; --accent:#4a5ae8; --accent-2:#149a68;
    --shadow:0 10px 30px rgba(20,24,33,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",Segoe UI,sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .topbar{display:flex;align-items:center;gap:16px;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.2px}
  .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
  .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  .icon-btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:9px;
    padding:7px 11px;cursor:pointer;font-size:13px}
  .icon-btn:hover{color:var(--fg);border-color:var(--accent)}

  .hero{padding:44px 0 22px}
  .hero h1{font-size:clamp(26px,4vw,40px);margin:0 0 8px;letter-spacing:-1px}
  .hero p{margin:0;color:var(--muted);font-size:15px}
  .stats{display:flex;gap:20px;margin-top:16px;color:var(--muted);font-size:13px}
  .stats b{color:var(--fg)}

  .search{position:relative;margin:22px 0 14px}
  .search input{width:100%;padding:14px 46px 14px 44px;border-radius:13px;border:1px solid var(--line);
    background:var(--panel);color:var(--fg);font-size:15px;outline:none}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  .search .mag{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);
    border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;background:var(--panel-2)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;
    padding:6px 14px;font-size:13px;cursor:pointer}
  .chip:hover{color:var(--fg)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));padding-bottom:60px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;
    cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:.15s;position:relative}
  .card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
  .card .cat{font-size:11px;color:var(--accent-2);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
  .card h3{margin:0;font-size:16.5px;letter-spacing:-.3px;padding-right:26px}
  .card p{margin:0;font-size:13.5px;color:var(--muted);flex:1}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);
    border-radius:6px;padding:2px 8px}
  .card .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);
    border-top:1px solid var(--line);padding-top:10px}
  .star{position:absolute;top:14px;right:14px;background:none;border:0;cursor:pointer;font-size:16px;
    color:var(--muted);line-height:1;padding:2px}
  .star[data-on="1"]{color:#f5c451}

  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 0}

  dialog{border:0;padding:0;background:transparent;max-width:min(920px,94vw);width:100%}
  dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(3px)}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
  .modal-head{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
  .modal-head h2{margin:0 0 6px;font-size:20px;letter-spacing:-.4px}
  .modal-head .sub{color:var(--muted);font-size:13px}
  .modal-tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--line);
    background:var(--panel-2)}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:9px;
    padding:7px 13px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost[aria-pressed="true"]{background:var(--panel-2);border-color:var(--accent);color:var(--fg)}
  .btn.close{margin-left:auto}
  .modal-body{overflow:auto;padding:22px}
  .modal-body pre{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.7;margin:0;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg)}
  .md h1,.md h2,.md h3{letter-spacing:-.4px;margin:1.2em 0 .5em}
  .md h1{font-size:24px} .md h2{font-size:19px} .md h3{font-size:16px}
  .md table{border-collapse:collapse;width:100%;font-size:13.5px;margin:1em 0}
  .md th,.md td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  .md th{background:var(--panel-2)}
  .md blockquote{border-left:3px solid var(--accent);margin:1em 0;padding:.2em 0 .2em 14px;color:var(--muted)}
  .md code{background:var(--panel-2);padding:2px 6px;border-radius:5px;font-size:.9em}
  .md ul,.md ol{padding-left:20px}
  .md li.task{list-style:none;margin-left:-20px}
  .md li.task input{margin-right:7px}
  .md pre{background:var(--panel-2);padding:12px 14px;border-radius:9px;overflow:auto}
  .md p{margin:.7em 0}
  .md hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--accent-2);color:#04150e;font-weight:700;font-size:13.5px;padding:10px 20px;
    border-radius:10px;transition:.22s;pointer-events:none;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:22px 0 40px}
</style>
</head>
<body>
<header class="top"><div class="wrap topbar">
  <div class="brand"><span class="logo">M</span><span>MD Templates</span></div>
  <div class="top-actions">
    <button class="icon-btn" id="favOnly" aria-pressed="false">★ 즐겨찾기</button>
    <button class="icon-btn" id="themeBtn">☀︎ / ☾</button>
  </div>
</div></header>

<main class="wrap">
  <section class="hero">
    <h1>내가 만든 마크다운 템플릿 모음</h1>
    <p>기획서·원고·체크리스트를 한곳에서 찾고, 클릭 한 번으로 복사하세요.</p>
    <div class="stats">
      <span>템플릿 <b id="sCount">0</b>개</span>
      <span>카테고리 <b id="sCat">0</b>개</span>
      <span>최종 갱신 <b id="sGen">-</b></span>
    </div>
  </section>

  <div class="search">
    <span class="mag">⌕</span>
    <input id="q" type="search" placeholder="템플릿 검색… (제목, 설명, 태그, 본문)" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>

<footer class="wrap">templates 폴더에 .md 파일을 추가하고 push 하면 이 목록에 자동으로 올라옵니다.</footer>

<dialog id="dlg"><div class="modal">
  <div class="modal-head"><h2 id="mTitle"></h2><div class="sub" id="mSub"></div></div>
  <div class="modal-tools">
    <button class="btn ghost" id="tabPreview" aria-pressed="true">미리보기</button>
    <button class="btn ghost" id="tabRaw" aria-pressed="false">원문(MD)</button>
    <button class="btn primary" id="btnCopy">복사</button>
    <button class="btn" id="btnDl">다운로드</button>
    <button class="btn" id="btnFav">★ 즐겨찾기</button>
    <button class="btn close" id="btnClose">닫기</button>
  </div>
  <div class="modal-body" id="mBody"></div>
</div></dialog>

<div class="toast" id="toast"></div>

<script>
const FAV_KEY = "mdtpl.favs.v1";
const state = { data:{templates:[],categories:[]}, q:"", cat:"전체", favOnly:false, favs:new Set(), current:null };

function loadFavs(){ try{ const r=localStorage.getItem(FAV_KEY); if(r) state.favs=new Set(JSON.parse(r)); }catch(e){} }
function saveFavs(){ try{ localStorage.setItem(FAV_KEY, JSON.stringify([...state.favs])); }catch(e){} }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1600); }
// ── 내장 마크다운 렌더러 (외부 라이브러리 없이 동작) ─────────────────
function mdInline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, (m,a)=>`<code>${a}</code>`);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m,a,b)=>`<img alt="${a}" src="${b}">`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m,a,b)=>`<a href="${b}" target="_blank" rel="noopener">${a}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  return s;
}
function renderMarkdown(src){
  const lines = src.replace(/\r\n?/g,"\n").split("\n");
  const out = []; let i = 0;
  const isTableSep = l => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l) && l.includes("-");
  const cells = l => l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
  while(i < lines.length){
    let l = lines[i];
    if(!l.trim()){ i++; continue; }
    if(/^```/.test(l)){
      const buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    if(/^\s{0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    let h = l.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n=h[1].length; out.push(`<h${n}>${mdInline(h[2])}</h${n}>`); i++; continue; }
    if(l.includes("|") && i+1 < lines.length && isTableSep(lines[i+1])){
      const head = cells(l); i += 2; const rows=[];
      while(i<lines.length && lines[i].includes("|") && lines[i].trim()){ rows.push(cells(lines[i++])); }
      out.push(`<table><thead><tr>${head.map(c=>`<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>`
        + rows.map(r=>`<tr>${r.map(c=>`<td>${mdInline(c)}</td>`).join("")}</tr>`).join("") + `</tbody></table>`);
      continue;
    }
    if(/^\s*>/.test(l)){
      const buf=[];
      while(i<lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/,""));
      out.push(`<blockquote>${renderMarkdown(buf.join("\n"))}</blockquote>`); continue;
    }
    if(/^\s*([-*+]|\d+\.)\s+/.test(l)){
      const ordered = /^\s*\d+\./.test(l); const items=[];
      while(i<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        let t = lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/,"");
        const box = t.match(/^\[( |x|X)\]\s*(.*)$/);
        items.push(box
          ? `<li class="task"><input type="checkbox" disabled ${box[1].toLowerCase()==="x"?"checked":""}> ${mdInline(box[2])}</li>`
          : `<li>${mdInline(t)}</li>`);
      }
      out.push(`<${ordered?"ol":"ul"}>${items.join("")}</${ordered?"ol":"ul"}>`); continue;
    }
    const para=[];
    while(i<lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*>|\s*([-*+]|\d+\.)\s|```)/.test(lines[i])
          && !(lines[i].includes("|") && i+1<lines.length && isTableSep(lines[i+1]))) para.push(lines[i++]);
    if(para.length) out.push(`<p>${mdInline(para.join("\n")).replace(/\n/g,"<br>")}</p>`);
  }
  return out.join("\n");
}
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function boot(){
  loadFavs();
  try{
    const res = await fetch("data/index.json", {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    state.data = await res.json();
  }catch(e){
    if(window.__EMBEDDED_INDEX__) state.data = window.__EMBEDDED_INDEX__;
    else { document.getElementById("grid").innerHTML =
      '<div class="empty">data/index.json 을 불러오지 못했습니다.<br>로컬에서 볼 때는 <code>python -m http.server</code> 로 열어주세요.</div>'; return; }
  }
  document.getElementById("sCount").textContent = state.data.templates.length;
  document.getElementById("sCat").textContent = (state.data.categories||[]).length;
  document.getElementById("sGen").textContent = (state.data.generated||"").slice(0,10);
  renderChips(); render();
}

function renderChips(){
  const cats = ["전체", ...(state.data.categories||[])];
  document.getElementById("chips").innerHTML = cats.map(c =>
    `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===state.cat}">${esc(c)}</button>`).join("");
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  return state.data.templates.filter(t=>{
    if(state.cat!=="전체" && t.category!==state.cat) return false;
    if(state.favOnly && !state.favs.has(t.id)) return false;
    if(!q) return true;
    return [t.title,t.description,t.category,(t.tags||[]).join(" "),t.body].join(" ").toLowerCase().includes(q);
  });
}

function render(){
  const list = filtered();
  const grid = document.getElementById("grid");
  if(!list.length){ grid.innerHTML='<div class="empty">조건에 맞는 템플릿이 없습니다.</div>'; return; }
  grid.innerHTML = list.map(t=>`
    <article class="card" data-id="${esc(t.id)}">
      <button class="star" data-star="${esc(t.id)}" data-on="${state.favs.has(t.id)?1:0}" title="즐겨찾기">★</button>
      <div class="cat">${esc(t.category)}</div>
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.description || t.body.slice(0,90)+"…")}</p>
      <div class="tags">${(t.tags||[]).map(x=>`<span class="tag">#${esc(x)}</span>`).join("")}</div>
      <div class="meta"><span>${esc(t.updated||"")}</span><span>${t.chars.toLocaleString()}자</span></div>
    </article>`).join("");
}

function openModal(id){
  const t = state.data.templates.find(x=>x.id===id); if(!t) return;
  state.current = t;
  document.getElementById("mTitle").textContent = t.title;
  document.getElementById("mSub").textContent =
    `${t.category} · ${t.path}` + ((t.tags||[]).length ? " · " + t.tags.map(x=>"#"+x).join(" ") : "");
  setTab("preview");
  syncFavBtn();
  document.getElementById("dlg").showModal();
}
function setTab(mode){
  const body = document.getElementById("mBody"), t = state.current;
  document.getElementById("tabPreview").setAttribute("aria-pressed", mode==="preview");
  document.getElementById("tabRaw").setAttribute("aria-pressed", mode==="raw");
  if(mode==="preview"){ body.className="modal-body md"; body.innerHTML = renderMarkdown(t.body); }
  else { body.className="modal-body"; body.innerHTML = "<pre></pre>"; body.firstChild.textContent = t.body; }
}
function syncFavBtn(){
  const on = state.favs.has(state.current.id);
  const b = document.getElementById("btnFav");
  b.textContent = on ? "★ 즐겨찾기 해제" : "☆ 즐겨찾기";
}
function toggleFav(id){
  state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
  saveFavs(); render();
}

document.addEventListener("click", e=>{
  const star = e.target.closest("[data-star]");
  if(star){ e.stopPropagation(); toggleFav(star.dataset.star); return; }
  const chip = e.target.closest(".chip");
  if(chip){ state.cat = chip.dataset.cat; renderChips(); render(); return; }
  const card = e.target.closest(".card");
  if(card){ openModal(card.dataset.id); }
});
document.getElementById("q").addEventListener("input", e=>{ state.q=e.target.value; render(); });
document.getElementById("favOnly").addEventListener("click", e=>{
  state.favOnly = !state.favOnly; e.currentTarget.setAttribute("aria-pressed", state.favOnly); render();
});
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", cur);
  try{ localStorage.setItem("mdtpl.theme", cur); }catch(e){}
});
document.getElementById("tabPreview").onclick = ()=>setTab("preview");
document.getElementById("tabRaw").onclick = ()=>setTab("raw");
document.getElementById("btnClose").onclick = ()=>document.getElementById("dlg").close();
document.getElementById("btnFav").onclick = ()=>{ toggleFav(state.current.id); syncFavBtn(); };
document.getElementById("btnCopy").onclick = async ()=>{
  try{ await navigator.clipboard.writeText(state.current.body); toast("복사되었습니다"); }
  catch(e){ toast("복사 실패 — 원문 탭에서 직접 선택해 주세요"); }
};
document.getElementById("btnDl").onclick = ()=>{
  const blob = new Blob([state.current.body], {type:"text/markdown;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = state.current.id + ".md";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};
document.addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement.id!=="q" && !document.getElementById("dlg").open){
    e.preventDefault(); document.getElementById("q").focus();
  }
});
try{ const th=localStorage.getItem("mdtpl.theme"); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}
boot();
</script>
</body>
</html>
